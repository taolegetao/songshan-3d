<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#e8dec9"><title>悬山 · 淡彩游观 V2</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8dec9;font-family:serif;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}.ui{position:absolute;inset:0;pointer-events:none;color:#676355}.head{position:absolute;top:28px;left:25px}.title{font-size:26px;letter-spacing:.35em}.sub{font-size:11px;letter-spacing:.18em;margin-top:9px;opacity:.7}.hint{position:absolute;bottom:27px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.09em;opacity:.75}.seal{position:absolute;bottom:55px;left:25px;border:1px solid #a67e6e;color:#a67e6e;padding:5px 4px;writing-mode:vertical-rl;font-size:12px;letter-spacing:3px}.reset{position:absolute;right:21px;top:30px;border:1px solid #a9a18d;border-radius:22px;background:#eee7d7b9;color:#696455;padding:9px 15px;font-size:13px;z-index:2}</style></head><body><canvas id="c"></canvas><div class="ui"><div class="head"><div class="title">悬 山</div><div class="sub">淡墨青岚 · 掌中游观</div></div><div class="seal">山水清音</div><div class="hint">单指游转 · 双指缩放 · 上滑仰视</div></div><button class="reset" id="reset">归正</button><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let W,H,dpr,scale;const P=(x,y,z)=>[x,y,z];let faces=[],strokes=[];const paper='#e9e0cc';let rot=-.3,tilt=.09,zoom=1,targetRot=rot,targetTilt=tilt,targetZoom=zoom,vr=0,vt=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const rand=n=>{let t=Math.sin(n*127.1+13.7)*43758.5453;return t-Math.floor(t)};
function face(points,color,shade=0){faces.push({points,color,shade})}function stroke(points,color='#92998c',width=.6){strokes.push({points,color,width})}
function color(hex,shift){let n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;return `rgb(${clamp(r+shift,0,255)},${clamp(g+shift,0,255)},${clamp(b+shift,0,255)})`}
function loft(x,y,z,r,h,seed,lean=0){let N=13,L=8,rings=[];let phase=seed*1.31;for(let j=0;j<=L;j++){let t=j/L;let rr=r*(.98-.54*t-.33*t*t)*(1+.06*Math.sin(t*11+seed));let ring=[];for(let i=0;i<N;i++){let a=i*Math.PI*2/N,warp=1+.19*Math.sin(3*a+phase)+.10*Math.cos(5*a-seed)+.09*Math.sin(8*a+seed+t*4);let xx=x+lean*t+Math.cos(a)*rr*warp+.09*Math.sin(t*5+seed),zz=z+Math.sin(a)*rr*warp*.72;let yy=y+h*t+.065*h*Math.sin(a*3+t*5+seed)*(1-t);ring.push(P(xx,yy,zz))}rings.push(ring)}let palette=['#cbd0c4','#d6d7cc','#c3cdc4','#d2d6cc','#bfcac4','#d9d9ce','#c8d3cd'];for(let j=0;j<L;j++)for(let i=0;i<N;i++){let k=(i+1)%N;let a=rings[j][i],b=rings[j][k],c=rings[j+1][k],d=rings[j+1][i];let shift=Math.round(5*Math.sin(i*1.7+j*.9+seed));face([a,b,c,d],palette[(i*3+j+seed)%palette.length],shift)}let top=rings[L];face(top,'#d4d7cb');
// Very restrained ink-wash creases: not mesh outlines.
for(let k=0;k<4;k++){let i=(k*3+seed)%N;let arr=[];for(let j=1;j<L;j++){let q=rings[j][i];arr.push(P(q[0]+.015,q[1],q[2]+.014))}stroke(arr,k%2?'#b1b7ad':'#a5ada3',.45)}
// Pale mineral-green drips descending from suspended rock.
if(y>1.1){for(let k=0;k<3;k++){let a=seed*2+k*2.2;let xx=x+Math.cos(a)*r*.36,zz=z+Math.sin(a)*r*.28;let len=.55+rand(seed*10+k)*.85;face([P(xx-.065,y+.08,zz),P(xx+.09,y+.11,zz),P(xx+.025,y-len,zz)],k%2?'#b6dfd9':'#a9d5d1')}}}
function branch(a,b,w,col){let dx=b[0]-a[0],dz=b[2]-a[2],dy=b[1]-a[1],nx=-dz,nz=dx,l=Math.hypot(nx,nz)||1;nx=nx/l*w;nz=nz/l*w;face([P(a[0]+nx,a[1],a[2]+nz),P(a[0]-nx,a[1],a[2]-nz),P(b[0]-nx*.55,b[1],b[2]-nz*.55),P(b[0]+nx*.55,b[1],b[2]+nz*.55)],col)}
function pine(x,y,z,s,seed){let a=P(x,y,z),b=P(x+.06*s,y+.8*s,z),c=P(x+.18*s,y+1.12*s,z+.04*s);branch(a,b,.035*s,'#696c60');branch(b,c,.022*s,'#696c60');for(let j=0;j<3;j++){let yy=y+s*(.67+j*.17),xx=x+s*(.06+j*.045),rr=s*(.31-j*.045);for(let k=0;k<8;k++){let ang=k*Math.PI/4+seed,px=xx+Math.cos(ang)*rr,pz=z+Math.sin(ang)*rr*.65;face([P(xx,yy+.085*s,z),P(px,yy+.045*s,pz),P(px+.055*s,yy-.035*s,pz+.025*s)],(k+j)%3===0?'#66766a':'#77877a')}}}
function slab(x,y,z,w,d,thick,col){face([P(x-w/2,y,z-d/2),P(x+w/2,y,z-d/2),P(x+w/2,y,z+d/2),P(x-w/2,y,z+d/2)],col);face([P(x-w/2,y,z+d/2),P(x+w/2,y,z+d/2),P(x+w/2,y-thick,z+d/2),P(x-w/2,y-thick,z+d/2)],'#b7b8aa')}
function pavilion(x,y,z,s,stories=1){for(let story=0;story<stories;story++){let base=y+story*1.04*s;slab(x,base,z,1.17*s,1.03*s,.09*s,'#d9d8cc');for(let i of [-1,1])for(let j of [-1,1]){let xx=x+i*.43*s,zz=z+j*.37*s;branch(P(xx,base,zz),P(xx,base+.73*s,zz),.035*s,'#77766b')}let yy=base+.72*s,edge=.78*s,ridge=yy+.32*s;let a=P(x-edge,yy,z-edge*.72),b=P(x+edge,yy,z-edge*.72),c=P(x+edge,yy,z+edge*.72),d=P(x-edge,yy,z+edge*.72),top=P(x,ridge,z);face([a,b,top],'#424b49');face([b,c,top],'#3f4947');face([c,d,top],'#515955');face([d,a,top],'#48514e');for(let q of [a,b,c,d])stroke([q,P(q[0]*.93+x*.07,q[1]+.085*s,q[2]*.93+z*.07)],'#515955',.7);branch(top,P(x,ridge+.13*s,z),.014*s,'#4e5049')}}
function walkway(points,w=.22){for(let i=0;i<points.length-1;i++){let a=points[i],b=points[i+1],dx=b[0]-a[0],dz=b[2]-a[2],l=Math.hypot(dx,dz)||1,nx=-dz/l*w,nz=dx/l*w;face([P(a[0]+nx,a[1],a[2]+nz),P(a[0]-nx,a[1],a[2]-nz),P(b[0]-nx,b[1],b[2]-nz),P(b[0]+nx,b[1],b[2]+nz)],i%2?'#deded1':'#e6e4d7');if(i%2===0){for(let sign of [-1,1]){let p=P(a[0]+sign*nx,a[1],a[2]+sign*nz);stroke([p,P(p[0],p[1]+.18,p[2])],'#969c90',.7)}}}}
function scene(){faces=[];strokes=[];let N=40;for(let i=0;i<N;i++){let a=i*2*Math.PI/N,b=(i+1)*2*Math.PI/N;let q=t=>P(2.55*Math.cos(t),-.65,1.56*Math.sin(t));let v=t=>P(2.18*Math.cos(t),-1.15,1.26*Math.sin(t));face([q(a),q(b),v(b),v(a)],i%5===0?'#b9dcd6':'#c4dfd8');face([P(0,-.65,0),q(a),q(b)],i%4===0?'#b5ded9':'#c4e2dc')}
// Interlocking asymmetrical peaks, thinner at top, with drifting silhouette.
loft(-1.18,-.57,-.15,.67,2.1,2,-.12);loft(-.55,.5,-.17,.66,2.7,4,.23);loft(.14,2.15,-.3,.65,2.6,6,-.23);loft(.68,3.78,-.3,.73,2.75,8,.15);loft(1.42,3.7,-.48,.49,2.05,10,-.2);loft(-1.82,-.55,.08,.4,1.35,11,.13);loft(.65,-.56,.35,.56,1.32,12,.14);loft(-.2,-.56,.65,.55,1.55,14,-.17);
// Organic footpaths climbing the peaks.
walkway([P(-.18,-.38,1.02),P(-.45,-.07,1.03),P(-.64,.25,.9),P(-.66,.57,.76),P(-.49,.84,.61),P(-.21,1.05,.51)],.18);
walkway([P(-1.27,1.1,.54),P(-1.01,1.25,.68),P(-.77,1.42,.81),P(-.51,1.65,.78),P(-.35,1.9,.56),P(-.18,2.16,.41)],.19);
walkway([P(-.21,2.25,.45),P(.05,2.55,.5),P(.28,2.85,.56),P(.37,3.17,.57),P(.52,3.47,.49)],.16);
pavilion(.55,4.18,.46,.68,2);pavilion(1.55,-.56,.68,.7,1);
pine(-1.67,1.0,.18,.47,2);pine(-.83,2.02,-.28,.38,4);pine(1.26,5.2,-.31,.36,7);pine(-.14,2.58,.61,.32,3);pine(.85,-.43,1.04,.31,6);pine(-1.86,.15,.09,.31,5);pine(.84,1.1,.4,.27,2);
}
function project(q){let x=q[0],y=q[1]-2.3,z=q[2],c=Math.cos(rot),s=Math.sin(rot),xx=x*c-z*s,zz=x*s+z*c,ct=Math.cos(tilt),st=Math.sin(tilt),yy=y*ct-zz*st;return {x:W*.5+xx*scale,y:H*.54-yy*scale,z:zz*ct+y*st}}
function render(){ctx.clearRect(0,0,W,H);let bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#ded4bd');bg.addColorStop(.55,'#eae1cb');bg.addColorStop(1,'#f0e9d8');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);scale=Math.min(W/6.7,H/10.1)*zoom;let items=[];for(let f of faces){let pts=f.points.map(project);items.push({pts,depth:pts.reduce((a,b)=>a+b.z,0)/pts.length,fill:color(f.color,f.shade||0)})}for(let l of strokes){let pts=l.points.map(project);items.push({pts,depth:pts.reduce((a,b)=>a+b.z,0)/pts.length-.002,line:l})}items.sort((a,b)=>b.depth-a.depth);for(let o of items){let pts=o.pts;if(!pts.length)continue;ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);if(o.line){ctx.strokeStyle=o.line.color;ctx.lineWidth=o.line.width*zoom;ctx.globalAlpha=.58;ctx.stroke();ctx.globalAlpha=1}else{ctx.closePath();ctx.fillStyle=o.fill;ctx.fill()}}}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);
let pointers=new Map(),lastDist=0,lastMid=null,lastMove=0;function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});vr=vt=0;lastDist=0;lastMid=null;lastMove=performance.now()});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let prev=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});let pts=[...pointers.values()];if(pts.length===1){let dx=e.clientX-prev.x,dy=e.clientY-prev.y;let dr=dx*.0075,dt=-dy*.0048;targetRot+=dr;targetTilt=clamp(targetTilt+dt,-.62,.78);vr=dr;vt=dt}else if(pts.length===2){let d=distance(pts[0],pts[1]);if(lastDist)targetZoom=clamp(targetZoom*d/lastDist,.72,2.45);lastDist=d;let mid={x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2};if(lastMid){targetRot+=(mid.x-lastMid.x)*.003;targetTilt=clamp(targetTilt-(mid.y-lastMid.y)*.002,-.62,.78)}lastMid=mid}lastMove=performance.now()});function end(e){pointers.delete(e.pointerId);lastDist=0;lastMid=null}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('wheel',e=>{e.preventDefault();targetZoom=clamp(targetZoom*Math.exp(-e.deltaY*.001),.72,2.45)},{passive:false});document.querySelector('.reset').onclick=()=>{targetRot=-.3;targetTilt=.09;targetZoom=1;vr=vt=0};function animate(){if(pointers.size===0&&performance.now()-lastMove<500){targetRot+=vr;targetTilt=clamp(targetTilt+vt,-.62,.78);vr*=.91;vt*=.87}rot+=(targetRot-rot)*.17;tilt+=(targetTilt-tilt)*.17;zoom+=(targetZoom-zoom)*.17;render();requestAnimationFrame(animate)}scene();resize();animate();</script></body></html>
