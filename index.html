<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>悬山 · 宋画山水交互</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9dfc5;touch-action:none;font-family:serif}canvas{display:block;width:100%;height:100%;touch-action:none}.ui{position:absolute;left:0;right:0;top:0;padding:22px 22px 0;pointer-events:none;color:#625e50}.title{font-size:26px;letter-spacing:.32em}.sub{font-size:11px;letter-spacing:.23em;opacity:.65;margin-top:8px}.hint{position:absolute;bottom:34px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.12em;color:#716f60;pointer-events:none}.reset{position:absolute;right:18px;top:24px;border:1px solid #a8a08b;background:#e8dec9b8;border-radius:30px;color:#655f51;padding:9px 13px;font-size:12px;cursor:pointer}.seal{position:absolute;left:24px;bottom:28px;border:1px solid #a16e60;color:#a16e60;padding:4px 3px;font-size:12px;writing-mode:vertical-rl;letter-spacing:3px;opacity:.8}</style></head><body><canvas id="c"></canvas><div class="ui"><div class="title">悬 山</div><div class="sub">一方山水 · 掌中游观</div></div><button class="reset" id="reset">归正</button><div class="seal">山水清音</div><div class="hint">单指旋转 · 双指缩放 · 上下拖动调整视角</div><script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,DPR,rot=-.32,tilt=.12,zoom=1,drag=false,px=0,py=0,prevDist=0;const ink='#555b55',rock='#c6c8bd',blue='#a9d9d8',paper='#e9dfc5';let shapes=[];function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);draw()}addEventListener('resize',resize);
function add(pts,fill,stroke=null,lw=.7,kind='poly'){shapes.push({pts,fill,stroke,lw,kind,depth:0})}function p(x,y,z){return [x,y,z]}function poly(pts,fill,stroke=ink,lw=.6){add(pts,fill,stroke,lw)}function line(pts,color=ink,lw=1){add(pts,null,color,lw,'line')}
function box(x,y,z,w,h,d,fill='#b8b9ad',edge='#73766f'){let a=p(x-w/2,y,z-d/2),b=p(x+w/2,y,z-d/2),c=p(x+w/2,y,z+d/2),e=p(x-w/2,y,z+d/2);poly([a,b,p(b[0],y+h,b[2]),p(a[0],y+h,a[2])],fill,edge);poly([b,c,p(c[0],y+h,c[2]),p(b[0],y+h,b[2])],fill,edge);poly([c,e,p(e[0],y+h,e[2]),p(c[0],y+h,c[2])],fill,edge);poly([e,a,p(a[0],y+h,a[2]),p(e[0],y+h,e[2])],fill,edge)}
function mountain(x,y,z,r,h,seed){let n=9, rings=[];for(let j=0;j<5;j++){let t=j/4,rr=r*(1-t*.78),cy=y+h*t;let ring=[];for(let i=0;i<n;i++){let a=i*2*Math.PI/n;let jitter=1+.15*Math.sin(i*5+seed+j*2);ring.push(p(x+Math.cos(a)*rr*jitter,cy+(Math.sin(i*3+seed+j)*.05*h),z+Math.sin(a)*rr*jitter*.8))}rings.push(ring)}for(let j=0;j<4;j++)for(let i=0;i<n;i++){let k=(i+1)%n;let palette=['#c7c9bd','#d6d6c9','#b7c4bd','#cbd0c3','#adbdb8'];poly([rings[j][i],rings[j][k],rings[j+1][k],rings[j+1][i]],palette[(i+j+seed)%5],'#858b80',.35)}for(let i=0;i<4;i++){let a=i*2*Math.PI/4+seed;let xx=x+Math.cos(a)*r*.6,zz=z+Math.sin(a)*r*.55;line([p(xx,y+h*.8,zz),p(xx+.12,y+h*.48,zz),p(xx-.07,y+h*.23,zz)],'#8c9b90',.65)}for(let i=0;i<3;i++){let a=(i+1)*2.1+seed;let xx=x+Math.cos(a)*r*.48,zz=z+Math.sin(a)*r*.4;poly([p(xx-.1,y+.12,zz),p(xx+.08,y+.1,zz),p(xx+.02,y-h*(.25+i*.08),zz)],'#a7d9d6',null)} }
function pine(x,y,z,s){line([p(x,y,z),p(x+.04*s,y+.55*s,z),p(x+.08*s,y+.9*s,z)],'#5d5a50',2.2*s);for(let j=0;j<3;j++){let yy=y+s*(.55+j*.16),xx=x+s*(.03+j*.02);for(let k=0;k<6;k++){let a=k*2*Math.PI/6+j;let r=s*(.2-j*.035);poly([p(xx,yy+.1*s,z),p(xx+Math.cos(a)*r,yy+.04*s,z+Math.sin(a)*r),p(xx+Math.cos(a+.4)*r*.7,yy-.045*s,z+Math.sin(a+.4)*r*.7)],j%2?'#66776b':'#53665d',null)}}}
function pavilion(x,y,z,s){box(x,y,z,1.3*s,.12*s,1.25*s,'#d6d3c7');for(let a of [-.45,.45])for(let b of [-.4,.4])box(x+a*s,y+.1*s,z+b*s,.055*s,.85*s,.055*s,'#615e55');let e=.86*s,roofY=y+1.02*s;poly([p(x-e,roofY,z-e*.7),p(x,roofY+.46*s,z),p(x+e,roofY,z-e*.7)],'#333d3c','#303638',1);poly([p(x-e,roofY,z+e*.7),p(x,roofY+.46*s,z),p(x+e,roofY,z+e*.7)],'#3e4947','#303638',1);poly([p(x-e,roofY,z-e*.7),p(x,roofY+.46*s,z),p(x-e,roofY,z+e*.7)],'#4d5550','#303638',1);poly([p(x+e,roofY,z-e*.7),p(x,roofY+.46*s,z),p(x+e,roofY,z+e*.7)],'#414a47','#303638',1);line([p(x,roofY+.46*s,z),p(x,roofY+.65*s,z)],'#353c39',1.2)}
function bridge(a,b,width=.19){let n=13;for(let i=0;i<n;i++){let t=i/n,u=(i+1)/n;let q=v=>p(a[0]*(1-v)+b[0]*v,a[1]*(1-v)+b[1]*v+.4*Math.sin(Math.PI*v),a[2]*(1-v)+b[2]*v);let v=q(t),w=q(u);poly([p(v[0],v[1],v[2]-width),p(v[0],v[1],v[2]+width),p(w[0],w[1],w[2]+width),p(w[0],w[1],w[2]-width)],'#e4e1d3','#8d9085',.45);if(i%2===0){line([p(v[0],v[1],v[2]-width),p(v[0],v[1]+.23,v[2]-width)],'#737a71',.8)}}}
function scene(){shapes=[];let N=24;for(let i=0;i<N;i++){let a=i*Math.PI*2/N,b=(i+1)*Math.PI*2/N;poly([p(2.7*Math.cos(a),-.55,1.65*Math.sin(a)),p(2.7*Math.cos(b),-.55,1.65*Math.sin(b)),p(2.3*Math.cos(b),-1.1,1.3*Math.sin(b)),p(2.3*Math.cos(a),-1.1,1.3*Math.sin(a))],i%3?'#b5d9d4':'#c1ded8','#83b9b3',.3);poly([p(0,-.55,0),p(2.7*Math.cos(a),-.55,1.65*Math.sin(a)),p(2.7*Math.cos(b),-.55,1.65*Math.sin(b))],i%3?'#b4dfdc':'#a5d4d2',null)}mountain(-.9,-.45,.0,.86,2.55,1);mountain(-.25,1.25,-.18,.78,2.1,3);mountain(.5,2.95,.1,.72,2.65,5);mountain(1.15,4.65,.0,.66,2.4,7);mountain(1.45,3.35,-.35,.5,2.05,4);mountain(-1.55,-.48,-.2,.52,1.5,6);mountain(.2,-.43,.7,.55,1.3,2);pavilion(.5,3.7,.55,.72);pavilion(.5,4.65,.55,.62);pavilion(1.5,-.46,.6,.68);bridge([-.92,1.2,.62],[-.15,2.15,.55]);bridge([-.7,.35,.68],[.12,.75,.9]);pine(-1.6,1.08,.15,.55);pine(-.95,1.95,-.4,.45);pine(1.6,5.85,.1,.4);pine(.45,2.9,.65,.3);pine(.95,-.32,.9,.37);pine(-1.85,.1,-.1,.28);}
function project(q){let x=q[0],y=q[1]-2.2,z=q[2];let c=Math.cos(rot),s=Math.sin(rot);let xx=x*c-z*s,zz=x*s+z*c;let ct=Math.cos(tilt),st=Math.sin(tilt);let yy=y*ct-zz*st;return {x:W/2+xx*scale,y:H*.54-yy*scale,z:zz*ct+y*st}}let scale;function draw(){ctx.clearRect(0,0,W,H);let bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#ded4b9');bg.addColorStop(.62,'#eae1ca');bg.addColorStop(1,'#efe7d3');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);scale=Math.min(W/6.8,H/10)*zoom;let ordered=shapes.map(o=>{let pts=o.pts.map(project);return {...o,screen:pts,depth:pts.reduce((s,v)=>s+v.z,0)/pts.length}}).sort((a,b)=>b.depth-a.depth);for(let o of ordered){let q=o.screen;ctx.beginPath();ctx.moveTo(q[0].x,q[0].y);for(let i=1;i<q.length;i++)ctx.lineTo(q[i].x,q[i].y);if(o.kind!=='line'){ctx.closePath();if(o.fill){ctx.fillStyle=o.fill;ctx.fill()}}if(o.stroke){ctx.strokeStyle=o.stroke;ctx.lineWidth=Math.max(.45,o.lw*zoom);ctx.stroke()}}}
function dist(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)}canvas.addEventListener('touchstart',e=>{if(e.touches.length===1){px=e.touches[0].clientX;py=e.touches[0].clientY}else if(e.touches.length===2)prevDist=dist(e.touches)},{passive:false});canvas.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length===2){let d=dist(e.touches);if(prevDist)zoom=Math.max(.65,Math.min(2.4,zoom*d/prevDist));prevDist=d}else if(e.touches.length===1){let x=e.touches[0].clientX,y=e.touches[0].clientY;rot+=(x-px)*.009;tilt=Math.max(-.45,Math.min(.55,tilt+(y-py)*.004));px=x;py=y}draw()},{passive:false});canvas.addEventListener('mousedown',e=>{drag=true;px=e.clientX;py=e.clientY});addEventListener('mouseup',()=>drag=false);addEventListener('mousemove',e=>{if(!drag)return;rot+=(e.clientX-px)*.009;tilt=Math.max(-.45,Math.min(.55,tilt+(e.clientY-py)*.004));px=e.clientX;py=e.clientY;draw()});canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.65,Math.min(2.4,zoom*(e.deltaY>0?.92:1.08)));draw()},{passive:false});document.getElementById('reset').onclick=()=>{rot=-.32;tilt=.12;zoom=1;draw()};scene();resize();
</script></body></html>
