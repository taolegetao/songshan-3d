<!doctype html>
<!-- v0.2: stone wash, attached waterfalls, arched bridge and corrected camera gestures. --><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#eee6d5"><title>悬山 · 宋画山水</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eae1cf;font-family:'Songti SC','Noto Serif CJK SC',serif;color:#706b60}canvas{display:block;width:100%;height:100%;touch-action:none}header{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;padding:25px 25px 0;pointer-events:none;display:flex;justify-content:space-between;align-items:start}h1{font-size:27px;font-weight:400;letter-spacing:.36em;margin:0 0 8px}header p{font-size:11px;letter-spacing:.19em;margin:0;color:#918a7c}.reset{pointer-events:auto;border:1px solid #aaa18f;background:#f0e8d8a8;border-radius:30px;padding:9px 15px;color:#756d60;font:14px 'Songti SC',serif}footer{position:absolute;bottom:max(30px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#938b7c;font-size:12px;letter-spacing:.12em;pointer-events:none}.seal{position:absolute;left:24px;bottom:76px;border:1px solid #ad8275;color:#ad8275;padding:7px 5px;writing-mode:vertical-rl;letter-spacing:.22em;font-size:13px;pointer-events:none}</style></head><body><canvas id="scene"></canvas><header><div><h1>悬 山</h1><p>淡墨青岚 · 掌中游观</p></div><button class="reset" id="reset">归正</button></header><div class="seal">山水清音</div><footer>单指旋转 · 双指缩放 · 下滑看山顶</footer><script>
(()=>{'use strict';const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');let W,H,dpr,scale=1,yaw=2.90,pitch=.12,vy=0,vp=0,zoom=1,drag=false,last=null,prevDist=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);scale=Math.min(W/8.6,H/14.2)*zoom;}window.addEventListener('resize',resize);resize();let seed=123456;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function rand(a,b){return a+(b-a)*rnd()}function vec(x,y,z){return {x,y,z}}const objects=[];function add(type,pts,style,extra={}){objects.push({type,pts,style,...extra})}function poly(pts,style,extra){add('poly',pts,style,extra)}function line(pts,style,width=1,extra={}){add('line',pts,style,{width,...extra})}function disc(x,y,z,rx,rz,style,steps=36){let p=[];for(let i=0;i<steps;i++){let a=i/steps*Math.PI*2;p.push(vec(x+Math.cos(a)*rx,y,z+Math.sin(a)*rz))}poly(p,style)}
// The rock silhouettes are designed as winding, offset stacks, not repeated cones.
function rock(spec){const {x,z,base,h,rx,rz,lean=0,phase=0,tiers=12,colors=0}=spec;let rings=[];for(let j=0;j<=tiers;j++){let t=j/tiers,yy=base+t*h;let taper=Math.pow(1-t,.53)*(.87+.16*Math.sin(t*9+phase))*(.78+.22*Math.min(1,t*5));let cx=x+lean*t+Math.sin(t*4+phase)*rx*.23,cz=z+Math.sin(t*3.8+phase)*rz*.18;let ring=[];const N=11;for(let k=0;k<N;k++){let a=k/N*Math.PI*2,noise=1+.17*Math.sin(a*3+phase+t*3)+.09*Math.sin(a*5+phase*2);let rr=Math.max(.06,taper)*noise;ring.push(vec(cx+Math.cos(a)*rx*rr,yy+Math.sin(a*2+phase)*.075,cz+Math.sin(a)*rz*rr))}rings.push(ring)}for(let j=0;j<tiers;j++)for(let k=0;k<11;k++){let a=rings[j][k],b=rings[j][(k+1)%11],c=rings[j+1][(k+1)%11],d=rings[j+1][k];let t=(j+.5)/tiers;poly([a,b,c,d],{kind:'stone',t,shade:Math.sin(k/11*Math.PI*2+phase)*.09,variation:rand(-.028,.028),colors})} // subtle ink contour only at selected creases
if(spec.water){let j=Math.max(1,Math.floor(tiers*.13)),k=spec.water.side??2;let lip=rings[j][k],below=rings[Math.max(0,j-2)][k];let outward=vec(lip.x+(lip.x-x)*.10,lip.y+.035,lip.z+(lip.z-z)*.10);let start=vec(lip.x,lip.y+.055,lip.z);let landing=vec(outward.x+.03,outward.y-spec.water.length,outward.z+.025);let width=spec.water.width||.11;let segments=18;for(let n=0;n<segments;n++){let t0=n/segments,t1=(n+1)/segments;function pt(t,offset){let bend=Math.sin(t*Math.PI)*.045;return vec(lerp(start.x,landing.x,t)+bend+offset,lerp(start.y,landing.y,t),lerp(start.z,landing.z,t)+.04*Math.sin(t*2))}poly([pt(t0,-width/2),pt(t0,width/2),pt(t1,width/2),pt(t1,-width/2)],{kind:'fall',t:t0});}line([start,outward],{kind:'waterSource'},1.3)}
for(let k of [1,5,8]){let p=[];for(let j=2;j<tiers-1;j++){let v=rings[j][k];p.push(vec(v.x+.009,v.y,v.z+.009))}line(p,{kind:'ink',alpha:.10},.48)} }
// Floating basin: broad soft elliptical pool with a translucent, tapered underside.
const N=44;let top=[],lower=[];for(let k=0;k<N;k++){let a=k/N*2*Math.PI,r=1+.025*Math.sin(7*a)+.018*Math.cos(11*a);top.push(vec(Math.cos(a)*3.25*r,.1,Math.sin(a)*2.13*r));lower.push(vec(Math.cos(a)*2.35*r,-.58,Math.sin(a)*1.47*r))}for(let k=0;k<N;k++){poly([top[k],top[(k+1)%N],lower[(k+1)%N],lower[k]],{kind:'basin',t:k/N})}poly(top,{kind:'water'});
// A crescent-shaped ascent: uneven stone clusters anchored to a curved route.
const rocks=[{x:-1.05,z:.12,base:.12,h:3.0,rx:.95,rz:.7,lean:-.34,phase:1.2,water:{level:.13,side:2,length:1.15,width:.16}},{x:.65,z:.22,base:.12,h:3.45,rx:1.0,rz:.83,lean:.1,phase:2.7},{x:1.7,z:-.25,base:.15,h:2.15,rx:.7,rz:.65,lean:-.4,phase:1.1},{x:-1.52,z:-.1,base:2.3,h:3.35,rx:.72,rz:.63,lean:.64,phase:3.2},{x:-.35,z:-.3,base:3.05,h:2.85,rx:.85,rz:.65,lean:.55,phase:4.1},{x:.25,z:-.65,base:4.6,h:3.9,rx:.9,rz:.7,lean:-.48,phase:2.1,water:{level:.13,side:2,length:1.85,width:.17}},{x:-.55,z:-.8,base:7.1,h:3.65,rx:.75,rz:.57,lean:.36,phase:3.7,water:{level:.13,side:2,length:2.25,width:.17}},{x:1.18,z:-1.0,base:6.7,h:3.55,rx:.64,rz:.58,lean:.36,phase:1.8,water:{level:.13,side:3,length:2.1,width:.16}},{x:1.75,z:-1.2,base:8.6,h:2.45,rx:.5,rz:.48,lean:-.18,phase:5.1},{x:-2.2,z:.3,base:.1,h:1.65,rx:.5,rz:.48,lean:.12,phase:2.3}];rocks.forEach(rock);
// Waterfall ribbons are generated from actual rock mesh rings above.
// Brush-like trails: stone slabs follow a sinuous path.
function trail(points,width=.27){for(let i=0;i<points.length-1;i++){let a=points[i],b=points[i+1],dx=b.x-a.x,dz=b.z-a.z,L=Math.hypot(dx,dz)||1,nx=-dz/L*width/2,nz=dx/L*width/2;poly([vec(a.x+nx,a.y,a.z+nz),vec(a.x-nx,a.y,a.z-nz),vec(b.x-nx,b.y,b.z-nz),vec(b.x+nx,b.y,b.z+nz)],{kind:'path',t:i/points.length});line([vec(a.x+nx,a.y+.013,a.z+nz),vec(b.x+nx,b.y+.013,b.z+nz)],{kind:'ink',alpha:.22},.5)} }trail([vec(.75,.32,1.05),vec(.43,.67,.91),vec(.05,1.18,.9),vec(-.3,1.65,.76),vec(-.68,2.17,.52),vec(-1.04,2.8,.48),vec(-1.3,3.5,.27),vec(-1.45,4.12,.04),vec(-1.1,4.6,-.13),vec(-.6,5.15,-.25),vec(-.3,5.72,-.35),vec(-.45,6.45,-.47),vec(-.4,7.18,-.53)],.34);
function beam(a,b,r,color){let dx=b.x-a.x,dz=b.z-a.z,rr=r;poly([vec(a.x-rr,a.y,a.z-rr),vec(a.x+rr,a.y,a.z-rr),vec(b.x+rr,b.y,b.z-rr),vec(b.x-rr,b.y,b.z-rr)],color);poly([vec(a.x+rr,a.y,a.z-rr),vec(a.x+rr,a.y,a.z+rr),vec(b.x+rr,b.y,b.z+rr),vec(b.x+rr,b.y,b.z-rr)],color)}
function pavilion(x,y,z,s=1,storeys=1){function V(a,b,c){return vec(x+a*s,y+b*s,z+c*s)}for(let st=0;st<storeys;st++){let y0=st*1.14;poly([V(-.56,y0,-.48),V(.56,y0,-.48),V(.56,y0,.48),V(-.56,y0,.48)],{kind:'platform'});for(let px of [-.43,.43])for(let pz of [-.35,.35])beam(V(px,y0,pz),V(px,y0+.88,pz),.035*s,{kind:'wood'});for(let pz of [-.35,.35])beam(V(-.47,y0+.79,pz),V(.47,y0+.79,pz),.035*s,{kind:'wood'}); // four curved eaves, visible supporting structure
let eave=y0+.88,ridge=y0+1.23;let A=V(-.78,eave,-.67),B=V(.78,eave,-.67),C=V(.78,eave,.67),D=V(-.78,eave,.67),R1=V(-.0,ridge,-.58),R2=V(0,ridge,.58);poly([A,B,R1],{kind:'roof',shade:.08});poly([D,C,R2],{kind:'roof',shade:-.02});poly([A,R1,R2,D],{kind:'roof',shade:.1});poly([B,C,R2,R1],{kind:'roof',shade:-.1});for(let p of [[A,D],[B,C],[A,B],[D,C]])line(p,{kind:'roofEdge'},1.15);beam(V(0,ridge,-.02),V(0,ridge+.16,-.02),.016,{kind:'wood'});} }
// Stone arch bridge: curved deck with open arch and stepped approaches.
function bridge(){const x0=-1.85,x1=-.38,z=.87,n=18;let upper=[],lower=[];for(let i=0;i<=n;i++){let t=i/n,x=lerp(x0,x1,t),arch=Math.sin(Math.PI*t);upper.push(vec(x,.48+arch*.57,z));lower.push(vec(x,.30+arch*.35,z));if(i<n){let t2=(i+1)/n;poly([vec(x,.48+arch*.57,z-.21),vec(x,.48+arch*.57,z+.21),vec(lerp(x0,x1,t2),.48+Math.sin(Math.PI*t2)*.57,z+.21),vec(lerp(x0,x1,t2),.48+Math.sin(Math.PI*t2)*.57,z-.21)],{kind:'path'});}}for(let i=0;i<n;i++){poly([upper[i],upper[i+1],lower[i+1],lower[i]],{kind:'bridge'});}line(upper,{kind:'ink',alpha:.42},1.1);line(lower,{kind:'ink',alpha:.35},.9)}bridge();
pavilion(2.05,.17,1.05,.85,1);pavilion(-.43,7.02,-.47,.76,2);
// Pine trees, sparse asymmetrical silhouette, muted ink foliage.
function pine(x,y,z,s){const V=(a,b,c)=>vec(x+a*s,y+b*s,z+c*s);beam(V(0,0,0),V(.055,1.1,0),.018*s,{kind:'wood'});for(let j=0;j<3;j++){let yy=.58+j*.2,spread=(.37-j*.075);let cx=.06+(j%2?.1:-.04);let pts=[];for(let k=0;k<8;k++){let a=k/8*2*Math.PI;pts.push(V(cx+Math.cos(a)*spread,yy+.03*Math.sin(k*2),Math.sin(a)*spread*.63))}poly(pts,{kind:'foliage',t:j/3});for(let k=0;k<4;k++)line([V(cx,yy+.06,0),pts[k*2]],{kind:'ink',alpha:.15},.35)} }
[[1.9,2.05,.4,.65],[-1.75,3.25,.45,.65],[-.65,6.3,-.1,.7],[1.4,8.45,-1,.62],[-1.6,.8,.8,.56],[2.5,.2,-.2,.62],[.55,3.7,.8,.48]].forEach(a=>pine(...a));
// Projection, with view-relative depth sorting.
function project(v){let c=Math.cos(yaw),s=Math.sin(yaw),x=v.x*c-v.z*s,z=v.x*s+v.z*c;let cp=Math.cos(pitch),sp=Math.sin(pitch);let yy=v.y*cp-z*sp,depth=v.y*sp+z*cp;return {x:W/2+x*scale,y:H*.51-(yy-5.15)*scale,depth}}function color(st,depth=0){if(typeof st==='string')return st;switch(st.kind){case'stone':{
 let t=st.t,shade=st.shade+st.variation;
 let wash=clamp((.91-t)*1.35,0,1);
 let shadow=clamp(.46-shade*1.7,0,1);
 let r=Math.round(lerp(190,113,wash)-shadow*19);
 let g=Math.round(lerp(190,169,wash)-shadow*13);
 let b=Math.round(lerp(182,184,wash)+wash*23-shadow*9);
 return `rgb(${r},${g},${b})`}
case'basin':return `rgba(116,185,195,${.68+.07*Math.cos(st.t*8)})`;case'water':return 'rgba(148,211,209,.82)';case'fall':return `rgba(108,187,195,${(.76*Math.pow(1-st.t,.7))})`;case'waterSource':return 'rgba(100,173,181,.68)';case'bridge':return '#aaa99f';case'path':return '#b9b9ad';case'platform':return '#b9b7ae';case'wood':return '#756c5d';case'roof':return st.shade>0?'#414b48':'#505b56';case'roofEdge':return '#313d3a';case'foliage':return ['#6c8073','#738779','#61776b'][Math.round(st.t*2)];case'ink':return `rgba(80,87,78,${st.alpha})`;}return '#aaa'}
function render(){ctx.clearRect(0,0,W,H);let bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#d8ccb2');bg.addColorStop(.58,'#e7dbc2');bg.addColorStop(1,'#e9dfca');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);let projected=objects.map(o=>{let pts=o.pts.map(project);return {...o,screen:pts,depth:pts.reduce((a,p)=>a+p.depth,0)/pts.length-(o.style.kind==='fall'?1.2:0)}}).sort((a,b)=>b.depth-a.depth);for(let o of projected){let p=o.screen;if(!p.length)continue;ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);for(let j=1;j<p.length;j++)ctx.lineTo(p[j].x,p[j].y);if(o.type==='poly'){ctx.closePath();ctx.fillStyle=color(o.style,o.depth);ctx.fill();}else{ctx.strokeStyle=color(o.style,o.depth);ctx.lineWidth=o.width||.7;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();}} // warm paper veil, faint grain
let veil=ctx.createLinearGradient(0,H*.1,W,H);veil.addColorStop(0,'rgba(246,237,217,.025)');veil.addColorStop(1,'rgba(255,246,226,.11)');ctx.fillStyle=veil;ctx.fillRect(0,0,W,H);
if(!drag){yaw+=vy;pitch=clamp(pitch+vp,-.52,.82);vy*=.90;vp*=.88;if(Math.abs(vy)<.00005)vy=0;if(Math.abs(vp)<.00005)vp=0}requestAnimationFrame(render)}
function distance(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)}canvas.addEventListener('touchstart',e=>{e.preventDefault();drag=true;vy=vp=0;if(e.touches.length===1){last={x:e.touches[0].clientX,y:e.touches[0].clientY};prevDist=0}else{prevDist=distance(e.touches);last=null}},{passive:false});canvas.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length===2){let d=distance(e.touches);if(prevDist)zoom=clamp(zoom*d/prevDist,.65,2.1);prevDist=d;resize();last=null;return}if(e.touches.length===1){let t=e.touches[0];if(last){let dx=t.clientX-last.x,dy=t.clientY-last.y;vy=clamp(dx*.005,-.08,.08);vp=clamp(-dy*.0038,-.055,.055);yaw+=vy;pitch=clamp(pitch+vp,-.52,.82)}last={x:t.clientX,y:t.clientY}}},{passive:false});canvas.addEventListener('touchend',e=>{if(!e.touches.length){drag=false;last=null;prevDist=0}else if(e.touches.length===1){last={x:e.touches[0].clientX,y:e.touches[0].clientY};prevDist=0}},{passive:false});let mouse=false;canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;mouse=true;drag=true;last={x:e.clientX,y:e.clientY};vy=vp=0;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!mouse||!last)return;let dx=e.clientX-last.x,dy=e.clientY-last.y;vy=dx*.005;vp=-dy*.0038;yaw+=vy;pitch=clamp(pitch+vp,-.52,.82);last={x:e.clientX,y:e.clientY}});canvas.addEventListener('pointerup',()=>{mouse=false;drag=false;last=null});canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=clamp(zoom*Math.exp(-e.deltaY*.001),.65,2.1);resize()},{passive:false});document.getElementById('reset').onclick=()=>{yaw=2.90;pitch=.12;zoom=1;vy=vp=0;resize()};render();})();
</script></body></html>
